<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:HK;font-weight:400;src:url(/fonts/HankenGrotesk-Regular.ttf)}
@font-face{font-family:HK;font-weight:500;src:url(/fonts/HankenGrotesk-Medium.ttf)}
@font-face{font-family:PM;src:url(/fonts/IBMPlexMono-Medium.ttf)}
html,body{margin:0;background:transparent;overflow:hidden}
</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const Q = new URLSearchParams(location.search); const C = Q.get('c') || 'A'; const PR = Q.get('p') || 'plugin-03';
const W = 2400, H = 1600;
await document.fonts.load('500 100px HK'); await document.fonts.load('400 100px HK'); await document.fonts.load('100px PM');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H); renderer.setClearColor(0, 0);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05; renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
const floor = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), new THREE.ShadowMaterial({ opacity: 0.2 })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const key = new THREE.DirectionalLight(0xffffff, 2.3); key.position.set(-7, 12, 6); key.castShadow = true; key.shadow.mapSize.set(4096, 4096); key.shadow.radius = 18; key.shadow.blurSamples = 25; key.shadow.bias = -0.0004;
Object.assign(key.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 60 }); scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 0.7); rim.position.set(9, 6, -8); scene.add(rim); scene.add(new THREE.AmbientLight(0xffffff, 0.12));
const Mt = (o) => { const m = new THREE.MeshPhysicalMaterial(o); m.envMapIntensity = 0.6; return m; };
const mat = { ink: Mt({ color: 0x16171a, roughness: 0.45, clearcoat: 0.3 }), white: Mt({ color: 0xf6f5f2, roughness: 0.5 }), paper: Mt({ color: 0xfbfaf8, roughness: 0.85 }),
  acc: Mt({ color: 0xff5533, roughness: 0.4, clearcoat: 0.4 }), glossAcc: Mt({ color: 0xff5533, roughness: 0.3, clearcoat: 0.6, clearcoatRoughness: 0.2 }),
  glossInk: Mt({ color: 0x1a1b1f, roughness: 0.2, clearcoat: 1, clearcoatRoughness: 0.08 }), glossWhite: Mt({ color: 0xf4f3f0, roughness: 0.2, clearcoat: 1, clearcoatRoughness: 0.08 }),
  alu: Mt({ color: 0xc9c8c4, roughness: 0.35, metalness: 0.8 }), dark: Mt({ color: 0x2a2b30, roughness: 0.5 }), glass: Mt({ color: 0x0b0b0c, roughness: 0.1, clearcoat: 1 }) };
function tex(draw, w = 1024, h = 1024) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); draw(g, w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; }
const tm = (t, r = 0.5) => { const m = new THREE.MeshPhysicalMaterial({ map: t, roughness: r, clearcoat: 0.2 }); m.envMapIntensity = 0.5; return m; };
function box(w, h, d, r, m) { const b = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 6, r), m); b.castShadow = b.receiveShadow = true; return b; }
const NAMES = [['01', 'Lead', 'Who Is Ready to Buy'], ['02', 'Follow-Up', 'Follow Up Without Chasing'], ['03', 'Proposal', "The Proposal You Don't Have to Write"], ['04', 'Session', 'The Hour After the Session'],
  ['05', 'Onboarding', "The Intake You Don't Have to Run"], ['06', 'Content', 'Story Library'], ['07', 'CRM', 'The CRM That Updates Itself'], ['08', 'Ads', 'Ads Without an Agency']];
function wrap(x, text, X, Y, maxW, lh) { const ws = text.split(' '); let l = '', y = Y; for (const w of ws) { const t = l + w + ' '; if (x.measureText(t).width > maxW && l) { x.fillText(l, X, y); l = w + ' '; y += lh; } else l = t; } x.fillText(l, X, y); return y; }

// unique abstract glyph per plugin, built from brand geometry (half discs, bars, dots)
function glyph(x, i, cx, cy, s, fg, ac) {
  x.save(); x.translate(cx, cy); x.scale(s, s);
  const hd = (X, Y, r, col, flip) => { x.fillStyle = col; x.beginPath(); x.arc(X, Y, r, flip ? -Math.PI / 2 : Math.PI / 2, flip ? Math.PI / 2 : Math.PI * 1.5); x.fill(); };
  const bar = (X, Y, w, h, col) => { x.fillStyle = col; x.fillRect(X, Y, w, h); };
  const dot = (X, Y, r, col) => { x.fillStyle = col; x.beginPath(); x.arc(X, Y, r, 0, 7); x.fill(); };
  switch (i) {
    case 0: [70, 48, 26].forEach((r, k) => { x.strokeStyle = k === 2 ? ac : fg; x.lineWidth = 14; x.beginPath(); x.arc(0, 0, r, 0, 7); x.stroke(); }); dot(0, 0, 10, ac); break; // lead: target
    case 1: hd(-20, 0, 60, fg); bar(10, -40, 70, 14, ac); bar(10, -8, 50, 14, ac); bar(10, 24, 30, 14, ac); break; // follow-up: fading lines
    case 2: bar(-55, -75, 110, 150, fg); bar(-35, -45, 70, 10, ac); bar(-35, -20, 70, 10, '#8E8C86'); bar(-35, 5, 50, 10, '#8E8C86'); bar(-35, 30, 70, 10, '#8E8C86'); break; // proposal: document
    case 3: hd(-10, 0, 70, fg); dot(40, -30, 14, ac); dot(40, 10, 14, ac); dot(40, 50, 14, ac); break; // session
    case 4: bar(-70, -70, 60, 60, fg); bar(10, -70, 60, 60, fg); bar(-70, 10, 60, 60, fg); bar(10, 10, 60, 60, ac); break; // onboarding: form grid
    case 5: for (let k = 0; k < 4; k++) bar(-70 + k * 36, -60 + (k % 2) * 12, 26, 120 - (k % 2) * 24, k === 2 ? ac : fg); break; // content: library spines
    case 6: x.strokeStyle = fg; x.lineWidth = 16; x.beginPath(); x.arc(0, 0, 60, 0.4, Math.PI * 1.8); x.stroke(); x.fillStyle = ac; x.beginPath(); x.moveTo(62, -10); x.lineTo(82, 30); x.lineTo(40, 25); x.fill(); break; // crm: cycle
    case 7: bar(-70, -15, 30, 50, fg); x.fillStyle = fg; x.beginPath(); x.moveTo(-40, -30); x.lineTo(60, -75); x.lineTo(60, 75); x.lineTo(-40, 45); x.fill(); bar(66, -20, 14, 40, ac); break; // ads: megaphone
  }
  x.restore();
}
function uiTex(i) { const [n, name, sub] = NAMES[i]; return tex((x, w, h) => {
  x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.fillStyle = '#F4F3F0'; x.fillRect(0, 0, w * 0.26, h);
  glyph(x, i, 80, 80, 0.38, '#101114', '#FF5533'); x.fillStyle = '#101114'; x.font = '500 34px HK'; x.fillText(name, 140, 92);
  x.fillStyle = '#66655F'; x.font = '500 20px PM'; ['YOUR FILES', 'offers.md', 'client.md', 'method.md', 'voice.md'].forEach((s, k) => x.fillText(s, 40, 200 + k * 54));
  const L = w * 0.3; x.fillStyle = '#B32F15'; x.font = '500 24px PM'; x.fillText('READY FOR REVIEW', L, 90); x.fillStyle = '#FF5533'; x.fillRect(w * 0.78, 52, w * 0.17, 60);
  x.fillStyle = '#101114'; x.font = '500 30px HK'; x.fillText('Send', w * 0.83, 93);
  const rows = { 0: ['Client A: asked for a call', 'Client B: opened the offer twice', 'Client C: replied to the email'], 1: ['To {Name}: after the call', 'To {Name}: after the offer', 'To {Name}: friendly check-in'],
    2: ['Where you are now', 'What we will do together', 'Investment and next step'], 3: ['Summary of the session', 'Next steps for {Name}', 'Follow-up email, drafted'], 4: ['Goals in their words', 'Context and constraints', 'First three steps'],
    5: ['Client story: before and after', 'A lesson I learned', 'Behind the scenes'], 6: ['Email received, logged', 'Call notes added', 'Next step set'], 7: ['Angle: the problem', 'Angle: the result', 'Angle: the story'] }[i];
  x.fillStyle = '#101114'; x.font = '500 60px HK'; x.fillText(i === 2 ? 'Proposal for {Client}' : sub, L, 190);
  rows.forEach((r, k) => { const y = 300 + k * 170; x.fillStyle = k === 0 ? '#FFE1D8' : '#F4F3F0'; x.fillRect(L - 20, y - 50, w * 0.66, 140); x.fillStyle = '#101114'; x.font = '500 34px HK'; x.fillText(r, L, y);
    x.fillStyle = '#DCD9D3'; x.fillRect(L, y + 26, w * 0.52, 12); x.fillRect(L, y + 54, w * 0.38, 12); });
}, 1600, 1000); }

// ---------- concept A: premium product box ----------
function boxA(i, s = 1) {
  const [n, name, sub] = NAMES[i]; const g = new THREE.Group(); const w = 2.6 * s, h = 3.4 * s, d = 0.8 * s;
  const front = tex((x, cw, ch) => { x.fillStyle = '#101114'; x.fillRect(0, 0, cw, ch); x.fillStyle = '#FF5533'; x.font = '500 46px PM'; x.fillText('PLUGIN ' + n, 70, 110);
    glyph(x, i, cw / 2, ch * 0.42, 2.0, '#F2F1EE', '#FF5533'); x.fillStyle = '#F2F1EE'; x.font = '500 110px HK'; x.fillText(name, 70, ch * 0.74);
    x.fillStyle = '#A3A29C'; x.font = '400 46px HK'; wrap(x, sub, 70, ch * 0.74 + 80, cw - 140, 58); x.fillStyle = '#FF5533'; x.fillRect(70, ch - 90, 120, 12); }, 1024, 1340);
  const spine = tex((x, cw, ch) => { x.fillStyle = '#FF5533'; x.fillRect(0, 0, cw, ch); x.save(); x.translate(cw / 2 + 18, ch - 60); x.rotate(-Math.PI / 2); x.fillStyle = '#101114'; x.font = '500 64px HK'; x.fillText(n + '  ' + name, 0, 0); x.restore(); }, 240, 1340);
  const top = tex((x, cw, ch) => { x.fillStyle = '#16171A'; x.fillRect(0, 0, cw, ch); }, 64, 64);
  const m = [tm(spine, 0.45), tm(spine, 0.45), tm(top), tm(top), tm(front, 0.35), tm(front, 0.35)];
  const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); b.position.y = h / 2; b.castShadow = true; g.add(b); return g;
}
// ---------- concept B: floating app screens ----------
function screenB(i, s = 1) { const g = new THREE.Group();
  const frame = box(4.8 * s, 3.0 * s, 0.08 * s, 0.1 * s, mat.glossWhite); g.add(frame);
  const p = new THREE.Mesh(new THREE.PlaneGeometry(4.6 * s, 2.875 * s), new THREE.MeshBasicMaterial({ map: uiTex(i), toneMapped: false })); p.position.z = 0.045 * s; g.add(p); return g; }
// ---------- concept C: hardcover file folder with tabs ----------
function folderC(i, s = 1) { const [n, name, sub] = NAMES[i]; const g = new THREE.Group();
  const cover = tex((x, cw, ch) => { x.fillStyle = '#16171A'; x.fillRect(0, 0, cw, ch); glyph(x, i, cw * 0.72, ch * 0.3, 1.5, '#F2F1EE', '#FF5533');
    x.fillStyle = '#FF5533'; x.font = '500 44px PM'; x.fillText('FILE ' + n, 70, 110); x.fillStyle = '#F2F1EE'; x.font = '500 100px HK'; x.fillText(name, 70, ch * 0.7);
    x.fillStyle = '#A3A29C'; x.font = '400 42px HK'; wrap(x, sub, 70, ch * 0.7 + 74, cw - 140, 54); }, 1024, 1300);
  const back = box(3.0 * s, 0.06 * s, 3.8 * s, 0.03 * s, mat.ink); back.position.y = 0.03 * s; g.add(back);
  for (let k = 0; k < 5; k++) { const pg = box(2.85 * s, 0.025 * s, 3.65 * s, 0.01 * s, mat.paper); pg.position.set(0.02 * s, 0.07 * s + k * 0.03 * s, 0); g.add(pg);
    const tab = box(0.5 * s, 0.025 * s, 0.3 * s, 0.02 * s, k === 1 ? mat.acc : mat.white); tab.position.set(1.55 * s, 0.07 * s + k * 0.03 * s, -1.4 * s + k * 0.62 * s); g.add(tab); }
  const lid = new THREE.Mesh(new THREE.BoxGeometry(3.0 * s, 0.06 * s, 3.8 * s), [mat.ink, mat.ink, tm(cover, 0.4), mat.ink, mat.ink, mat.ink]); lid.position.y = 0.25 * s; lid.castShadow = true; g.add(lid);
  return g; }
// ---------- concept D: glossy 3D app tile ----------
function tileD(i, s = 1) { const g = new THREE.Group(); const sz = 2.4 * s;
  const base = box(sz, 0.55 * s, sz, 0.5 * s, i === 2 || i < 0 ? mat.glossAcc : mat.glossWhite); base.position.y = 0.275 * s; g.add(base);
  const t = tex((x, cw, ch) => { glyph(x, Math.max(i, 0), cw / 2, ch / 2, 2.6, i === 2 ? '#101114' : '#101114', i === 2 ? '#F4F3F0' : '#FF5533'); }, 1024, 1024);
  const face = new THREE.Mesh(new THREE.PlaneGeometry(sz * 0.8, sz * 0.8), new THREE.MeshBasicMaterial({ map: t, transparent: true, toneMapped: false })); face.rotation.x = -Math.PI / 2; face.position.y = 0.552 * s; g.add(face);
  return g; }

const cam = new THREE.PerspectiveCamera(28, W / H, 0.1, 300); const root = new THREE.Group(); scene.add(root);
function fit(dir, fill = 0.82) { const b = new THREE.Box3().setFromObject(root); const c = b.getCenter(new THREE.Vector3());
  const pts = []; for (const x of [b.min.x, b.max.x]) for (const y of [b.min.y, b.max.y]) for (const z of [b.min.z, b.max.z]) pts.push(new THREE.Vector3(x, y, z));
  let dist = b.getSize(new THREE.Vector3()).length() * 1.5; const d = dir.clone().normalize();
  for (let it = 0; it < 6; it++) { cam.position.copy(c).add(d.clone().multiplyScalar(dist)); cam.lookAt(c); cam.updateMatrixWorld();
    let a = 9, bx = -9, cy = 9, dy = -9; for (const p of pts) { const q = p.clone().project(cam); a = Math.min(a, q.x); bx = Math.max(bx, q.x); cy = Math.min(cy, q.y); dy = Math.max(dy, q.y); }
    const hh = Math.tan(THREE.MathUtils.degToRad(cam.fov / 2)) * dist, hw = hh * cam.aspect;
    c.add(new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 0).multiplyScalar((a + bx) / 2 * hw)).add(new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 1).multiplyScalar((cy + dy) / 2 * hh));
    dist *= Math.max((bx - a) / 2, (dy - cy) / 2) / fill; }
  cam.position.copy(c).add(d.clone().multiplyScalar(dist)); cam.lookAt(c); }

const one = PR === 'plugin-03';
if (C === 'A') {
  if (one) { const b = boxA(2); b.rotation.y = 0.45; root.add(b); fit(new THREE.Vector3(0.55, 0.32, 1)); }
  else { NAMES.forEach((_, i) => { const b = boxA(i, 0.8); b.position.set(-6 + i * 1.72 - (i > 3 ? 0 : 0), 0, (i % 2) * 0.25); b.rotation.y = 0.32; root.add(b); }); fit(new THREE.Vector3(0.35, 0.3, 1)); }
} else if (C === 'B') {
  if (one) { [[-1.2, 2.2, -1.6, 0.35, 0.92, 1], [0.6, 1.7, 0, 0.35, 1.0, 2]].forEach(([x, y, z, ry, sc, idx], k) => { const s = screenB(k === 1 ? 2 : 2, sc); s.position.set(x, y, z); s.rotation.y = ry; s.rotation.x = -0.05; root.add(s); });
    const s = screenB(2, 1.0); root.children[0].visible = false; fit(new THREE.Vector3(0.45, 0.28, 1), 0.78); }
  else { NAMES.forEach((_, i) => { const s = screenB(i, 0.62); const col = i % 4, row = Math.floor(i / 4); s.position.set(-4.6 + col * 3.1, 3.4 - row * 2.1 + col * 0.0, -row * 1.2 - col * 0.25); s.rotation.y = 0.3; root.add(s); }); fit(new THREE.Vector3(0.35, 0.2, 1), 0.86); }
  key.castShadow = true;
} else if (C === 'C') {
  if (one) { const f = folderC(2); f.rotation.y = -0.4; root.add(f); fit(new THREE.Vector3(-0.3, 1.0, 0.85)); }
  else { NAMES.forEach((_, i) => { const f = folderC(i, 0.7); f.position.set(-0.3 * i, i * 0.36, -0.55 * i); f.rotation.y = -0.4 + i * 0.07; root.add(f); }); fit(new THREE.Vector3(-0.3, 0.9, 1)); }
} else if (C === 'D') {
  if (one) { const t = tileD(2); t.rotation.y = -0.6; root.add(t); fit(new THREE.Vector3(-0.4, 0.95, 1)); }
  else { NAMES.forEach((_, i) => { const t = tileD(i, 0.8); const col = i % 4, row = Math.floor(i / 4); t.position.set(-3.3 + col * 2.2, 0, -1.1 + row * 2.2); t.rotation.y = 0; root.add(t); }); fit(new THREE.Vector3(-0.3, 1.1, 1)); }
}
renderer.render(scene, cam); window.__done = true;
</script></body></html>
