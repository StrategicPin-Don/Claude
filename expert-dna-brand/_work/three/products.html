<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const Q = new URLSearchParams(location.search);
const W = 2400, H = 1600;
const PROD = Q.get('p') || 'plugin-03';
const VIEW = Q.get('v') || 'hero';
await document.fonts.load('500 100px HK'); await document.fonts.load('400 100px HK'); await document.fonts.load('100px PM');

const INK = 0x16171a, ACC = 0xff5533, WHITE = 0xf2f1ee;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H); renderer.setClearColor(0x000000, 0);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.ShadowMaterial({ opacity: 0.22 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const key = new THREE.DirectionalLight(0xffffff, 2.4); key.position.set(-7, 11, 5); key.castShadow = true;
key.shadow.mapSize.set(4096, 4096); key.shadow.radius = 16; key.shadow.blurSamples = 25; key.shadow.bias = -0.0004;
Object.assign(key.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 50 }); scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 0.6); rim.position.set(8, 5, -8); scene.add(rim);
scene.add(new THREE.AmbientLight(0xffffff, 0.1));

const M = (o) => { const m = new THREE.MeshPhysicalMaterial(o); m.envMapIntensity = 0.55; return m; };
const mat = {
  body: M({ color: INK, roughness: 0.42, clearcoat: 0.35, clearcoatRoughness: 0.5 }),
  ceramic: M({ color: WHITE, roughness: 0.32, clearcoat: 0.6, clearcoatRoughness: 0.2 }),
  orange: M({ color: ACC, roughness: 0.28, metalness: 0.55, clearcoat: 0.5 }),
  card: M({ color: 0xfbfaf8, roughness: 0.85 }),
  alu: M({ color: 0xc9c8c4, roughness: 0.35, metalness: 0.8 }),
  graphite: M({ color: 0x2a2b30, roughness: 0.5 }),
  screen: M({ color: 0x0b0b0c, roughness: 0.15, clearcoat: 1 }),
};

function tex(draw, w = 1024, h = 512) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
function plane(w, h, t, rough = 0.6) { return new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshStandardMaterial({ map: t, transparent: true, roughness: rough, envMapIntensity: 0.4 })); }
function box(w, h, d, r, m) { const b = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 5, r), m); b.castShadow = b.receiveShadow = true; return b; }
function halfMoon(r, depth, m) {
  const s = new THREE.Shape(); s.moveTo(0, -r); s.absarc(0, 0, r, -Math.PI / 2, Math.PI / 2, true); s.lineTo(0, -r);
  const g = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: true, bevelThickness: 0.015, bevelSize: 0.015, bevelSegments: 3, curveSegments: 64 });
  const mesh = new THREE.Mesh(g, m); mesh.castShadow = true; return mesh;
}
function ex(obj, x, y, z) { obj.userData.ex = new THREE.Vector3(x, y, z); return obj; }

// ---------- objects ----------
function plugParts(grp, x, y, z, s = 1, explode = 0) {
  const bar = box(0.12 * s, 0.7 * s, 1.5 * s, 0.03 * s, mat.orange); bar.position.set(x + 0.06 * s, y, z); grp.add(ex(bar, 0.5, 0, 0));
  const p1 = box(0.8 * s, 0.12 * s, 0.16 * s, 0.04 * s, mat.orange); p1.position.set(x + 0.12 * s + 0.4 * s, y, z - 0.3 * s); grp.add(ex(p1, 1.1, 0, 0));
  const p2 = box(0.55 * s, 0.12 * s, 0.16 * s, 0.04 * s, mat.orange); p2.position.set(x + 0.12 * s + 0.275 * s, y, z + 0.3 * s); grp.add(ex(p2, 1.1, 0, 0));
}
function moduleObj(num, name, flip = false) {
  const g = new THREE.Group(); const bw = 3.0, bh = 0.9, bd = 2.0;
  const body = box(bw, bh, bd, 0.16, mat.body); body.position.y = bh / 2; g.add(ex(body, 0, 0, 0));
  const hm = halfMoon(0.62, 0.04, mat.ceramic); hm.rotation.x = -Math.PI / 2; hm.position.set(-0.55, bh + 0.001, 0.15); g.add(ex(hm, 0, 1.0, 0));
  const t = tex((c) => { c.fillStyle = '#FF5533'; c.font = '500 150px PM'; c.fillText(num, 40, 180); c.fillStyle = '#F2F1EE'; c.font = '500 120px HK'; c.fillText(name, 40, 380); });
  const lab = plane(1.5, 0.75, t); lab.rotation.x = -Math.PI / 2; if (flip) lab.rotation.z = Math.PI; lab.position.set(0.55, bh + 0.003, flip ? -0.25 : 0.25); g.add(lab);
  plugParts(g, bw / 2, bh / 2, 0);
  return g;
}
function cardObj(title, sub, w = 1.6, h = 2.1, dark = false) {
  const g = new THREE.Group();
  const c = box(w, 0.03, h, 0.01, dark ? mat.body : mat.card); c.position.y = 0.015; g.add(c);
  const t = tex((x, cw, ch) => { x.fillStyle = dark ? '#FF5533' : '#B32F15'; x.font = '500 54px PM'; x.fillText(sub.toUpperCase(), 60, 110);
    x.fillStyle = dark ? '#F2F1EE' : '#101114'; x.font = '500 96px HK';
    const words = title.split(' '); let line = '', y = 260; for (const wd of words) { const tl = line + wd + ' '; if (x.measureText(tl).width > cw - 120) { x.fillText(line, 60, y); line = wd + ' '; y += 110; } else line = tl; } x.fillText(line, 60, y);
    x.fillStyle = dark ? '#34383F' : '#E2E0DB'; for (let i = 0; i < 4; i++) x.fillRect(60, y + 90 + i * 70, (cw - 120) * (i % 2 ? 0.7 : 0.9), 22); }, 1024, Math.round(1024 * h / w));
  const p = plane(w * 0.98, h * 0.98, t, 0.8); p.rotation.x = -Math.PI / 2; p.position.y = 0.032; g.add(p);
  return g;
}

  return g;
}

  const hm = halfMoon(0.8, 0.05, mat.ceramic); hm.position.set(-0.3, 0, 0.14); lid.add(hm); hm.rotation.x = -Math.PI / 2; hm.position.y = 0.13;
  const files = ['Offers and prices', 'Ideal client', 'Method', 'Voice', 'Stories', 'Rules'];

      x.fillStyle = '#B32F15'; x.font = '500 64px PM'; x.fillText('FILE 0' + (i + 1), 70, 150); x.fillStyle = '#101114'; x.font = '500 110px HK'; x.fillText(f, 70, 300);
      x.fillStyle = '#E2E0DB'; for (let k = 0; k < 6; k++) x.fillRect(70, 420 + k * 100, 880 * (k % 2 ? 0.7 : 0.92), 26); }, 1024, 1400);
    const card = new THREE.Mesh(new THREE.BoxGeometry(3.4, 2.2, 0.02), [mat.card, mat.card, mat.card, mat.card, new THREE.MeshStandardMaterial({ map: t, roughness: 0.8 }), mat.card]);
    card.castShadow = true; card.position.set(0, 1.3 + 0.55 + i * 0.05 - (i * 0.0), 1.05 - i * 0.42); card.rotation.x = -0.12; card.userData.exRot = (i - 2.5) * 0.09; g.add(ex(card, (i - 2.5) * 1.15, 1.6 + Math.abs(i - 2.5) * -0.25, 0.9 + i * 0.25)); });
  return g;
}
function socketObj() {
  const g = new THREE.Group();
  const plate = box(3.2, 3.2, 0.4, 0.3, mat.ceramic); plate.position.set(-1.2, 1.6, 0); plate.rotation.y = Math.PI / 2; g.add(ex(plate, -0.8, 0, 0));
  const s1 = box(0.12, 0.2, 0.9, 0.04, mat.body); s1.position.set(-0.98, 1.95, 0); g.add(s1);

}
function stripObj() {
  const g = new THREE.Group();
  const strip = box(9.5, 0.8, 2.0, 0.2, mat.graphite); strip.position.set(0, 0.4, 0); g.add(ex(strip, 0, 0, 0));
  for (let i = 0; i < 4; i++) { const s = box(1.4, 0.04, 1.2, 0.05, mat.orange); s.position.set(-3.4 + i * 2.25, 0.81, 0); g.add(s); }
  const names = [['01', 'Lead'], ['03', 'Proposal'], ['07', 'CRM']];
  names.forEach((n, i) => { const m = moduleObj(n[0], n[1]); m.rotation.y = -Math.PI / 2; m.position.set(-3.4 + i * 2.25, 0, 2.95); m.scale.setScalar(0.85); m.userData.ex = new THREE.Vector3(0, 0, 1.6); g.add(m); });
  const curve = new THREE.CatmullRomCurve3([new THREE.Vector3(4.75, 0.4, 0), new THREE.Vector3(6.5, 0.15, 0.6), new THREE.Vector3(7.2, 0.12, 3.2), new THREE.Vector3(5.5, 0.12, 5.2)]);
  const cable = new THREE.Mesh(new THREE.TubeGeometry(curve, 80, 0.12, 16), mat.orange); cable.castShadow = true; g.add(ex(cable, 0.6, 0, 0));
  return g;
}
function stairsObj() {
  const g = new THREE.Group();
  for (let i = 0; i < 4; i++) { const h = 0.7 + i * 0.7; const b = box(1.9, h, 2.6, 0.14, i === 3 ? mat.body : mat.graphite); b.position.set(-3 + i * 2.0, h / 2, 0); g.add(ex(b, 0, i * 0.3, 0)); }
  const hm = halfMoon(0.55, 0.04, mat.ceramic); hm.rotation.x = -Math.PI / 2; hm.position.set(-3.2, 0.71, 0.1); g.add(ex(hm, 0, 1.2, 0));
  const m = moduleObj('GR', 'Growth'); m.scale.setScalar(0.62); m.position.set(3.0, 2.8, 0); m.rotation.y = -0.2; m.userData.ex = new THREE.Vector3(0, 1.6, 0); g.add(m);

function sculptureObj() {

  const p1 = box(1.2, 0.18, 0.24, 0.06, mat.orange); p1.position.set(0.42 + 0.6 + 0.15, 3.12, 0); g.add(ex(p1, 1.4, 0.5, 0));
  const p2 = box(0.82, 0.18, 0.24, 0.06, mat.orange); p2.position.set(0.42 + 0.41 + 0.15, 2.52, 0); g.add(ex(p2, 1.4, 0.5, 0));

  const g = new THREE.Group();
  const b = box(4.6, 2.4, 3.4, 0.16, mat.body); b.position.y = 1.2; g.add(ex(b, 0, 0, 0));
  const band = box(0.7, 2.44, 3.44, 0.06, mat.orange); band.position.set(0.9, 1.2, 0); g.add(ex(band, 0, 0.9, 0));
  const band2 = box(4.64, 2.44, 0.5, 0.06, mat.orange); band2.position.set(0, 1.2, -0.7); g.add(ex(band2, 0, 1.4, 0));
  const hm = halfMoon(0.75, 0.04, mat.ceramic); hm.rotation.x = -Math.PI / 2; hm.position.set(-1.2, 2.41, -0.15); g.add(ex(hm, 0, 2.0, 0));
  const t = tex((x) => { x.fillStyle = '#F2F1EE'; x.font = '500 120px HK'; x.fillText('Done For You', 30, 160); x.fillStyle = '#A3A29C'; x.font = '500 54px PM'; x.fillText('READY TO RUN', 34, 270); });
  const lab = plane(2.4, 1.2, t); lab.rotation.x = -Math.PI / 2; lab.position.set(-0.75, 2.415, 1.0); lab.rotation.z = 0; g.add(ex(lab, 0, 2.0, 0));
  return g;
}

function laptopObj(title, rows) {
  const g = new THREE.Group();
  const base = box(6.4, 0.2, 4.3, 0.12, mat.alu); base.position.y = 0.1; g.add(base);
  const kb = box(5.6, 0.02, 2.0, 0.02, mat.graphite); kb.position.set(0, 0.21, -0.65); g.add(kb);
  const lid = new THREE.Group(); lid.position.set(0, 0.2, -2.15); lid.rotation.x = -0.28; g.add(lid);
  const back = box(6.4, 4.1, 0.14, 0.12, mat.alu); back.position.set(0, 2.05, 0); lid.add(back);
  const bez = box(6.2, 3.95, 0.02, 0.1, mat.screen); bez.position.set(0, 2.05, 0.08); lid.add(bez);
  const t = tex((x, w, h) => { x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, w, h); x.fillStyle = '#F4F3F0'; x.fillRect(0, 0, w * 0.24, h);
    x.fillStyle = '#101114'; x.beginPath(); x.arc(70, 70, 26, Math.PI / 2, Math.PI * 1.5); x.fill(); x.fillStyle = '#FF5533'; x.fillRect(80, 44, 6, 52); x.fillRect(94, 58, 26, 6); x.fillRect(94, 82, 18, 6);
    x.fillStyle = '#66655F'; x.font = '500 22px PM'; ['FILES', 'offers.md', 'client.md', 'method.md', 'voice.md'].forEach((s, i) => x.fillText(s, 40, 170 + i * 56));
    x.fillStyle = '#B32F15'; x.font = '500 24px PM'; x.fillText('READY', w * 0.28, 90);
    x.fillStyle = '#101114'; x.font = '500 64px HK'; x.fillText(title, w * 0.28, 170);
    rows.forEach((r, i) => { x.fillStyle = '#101114'; x.font = '500 32px HK'; x.fillText(r, w * 0.28, 270 + i * 150); x.fillStyle = '#E2E0DB'; x.fillRect(w * 0.28, 300 + i * 150, w * 0.6, 14); x.fillRect(w * 0.28, 330 + i * 150, w * 0.45, 14); });
    x.fillStyle = '#FF5533'; x.fillRect(w * 0.78, 50, w * 0.17, 60); }, 1600, 1000);
  const scr = plane(6.0, 3.75, t, 0.2); scr.position.set(0, 2.05, 0.1); lid.add(scr);
  return g;
}

// ---------- products ----------
const P = {
  'plugin-01': { obj: () => moduleObj('01', 'Lead'), screen: ['Who is ready to buy', ['Client A: asked for a call', 'Client B: opened the offer', 'Client C: replied']], contents: [['Plugin files', 'Plugin'], ['Mini course', 'Course'], ['Worksheet', 'Sheet']] },
  'plugin-02': { obj: () => moduleObj('02', 'Follow-Up'), screen: ['Follow-ups, drafted', ['To {Name}: after the call', 'To {Name}: after the offer', 'To {Name}: check in']], contents: [['Plugin files', 'Plugin'], ['Mini course', 'Course'], ['Worksheet', 'Sheet']] },
  'plugin-03': { obj: () => moduleObj('03', 'Proposal'), screen: ['Proposal for {Client}', ['Where you are now', 'What we will do', 'Investment']], contents: [['Plugin files', 'Plugin'], ['Mini course', 'Course'], ['Worksheet', 'Sheet']] },
  'plugin-04': { obj: () => moduleObj('04', 'Session'), screen: ['After the session', ['Summary', 'Next steps', 'Follow-up email']], contents: [['Plugin files', 'Plugin'], ['Mini course', 'Course'], ['Worksheet', 'Sheet']] },
  'plugin-05': { obj: () => moduleObj('05', 'Onboarding'), screen: ['Client profile', ['Goals', 'Context', 'First steps']], contents: [['Plugin files', 'Plugin'], ['Mini course', 'Course'], ['Worksheet', 'Sheet']] },
  'plugin-06': { obj: () => moduleObj('06', 'Content'), screen: ['Story library', ['Client story', 'Lesson learned', 'Behind the scenes']], contents: [['Plugin files', 'Plugin'], ['Mini course', 'Course'], ['Worksheet', 'Sheet']] },
  'plugin-07': { obj: () => moduleObj('07', 'CRM'), screen: ['{Client}: up to date', ['Email received', 'Call notes added', 'Next step set']], contents: [['Plugin files', 'Plugin'], ['Mini course', 'Course'], ['Worksheet', 'Sheet']] },
  'plugin-08': { obj: () => moduleObj('08', 'Ads'), screen: ['Ad drafts', ['Angle: the problem', 'Angle: the result', 'Angle: the story']], contents: [['Plugin files', 'Plugin'], ['Mini course', 'Course'], ['Worksheet', 'Sheet']] },
  'all-8': { obj: dockObj, big: true, screen: ['Your plugins', ['Lead, Follow-Up, Proposal', 'Session, Onboarding, Content', 'CRM, Ads']], contents: [['8 plugins', 'Plugins'], ['8 mini courses', 'Course'], ['Worksheets', 'Sheet']] },
  'starter': { obj: starterObj, screen: ['Your files', ['Offers and prices', 'Ideal client', 'Method and voice']], contents: [['Offers and prices', 'File'], ['Ideal client', 'File'], ['Method', 'File'], ['Voice', 'File'], ['Stories', 'File'], ['Rules', 'File']] },
  'setup-call': { obj: socketObj, screen: ['Setup call', ['Your files reviewed', 'Plugins set up', 'First run together']], contents: [['Call with a specialist', 'Call'], ['Setup checklist', 'Sheet'], ['First run', 'Plugin']] },

const prod = P[PROD];
const camera = new THREE.PerspectiveCamera(28, W / H, 0.1, 200);
const root = new THREE.Group(); scene.add(root);

function fit(obj, cam, dir, fill = 0.8) {
  const b = new THREE.Box3().setFromObject(obj); const c = b.getCenter(new THREE.Vector3());
  const pts = []; for (const x of [b.min.x, b.max.x]) for (const y of [b.min.y, b.max.y]) for (const z of [b.min.z, b.max.z]) pts.push(new THREE.Vector3(x, y, z));
  let dist = b.getSize(new THREE.Vector3()).length() * 1.5; const d = dir.clone().normalize();
  for (let it = 0; it < 6; it++) {
    cam.position.copy(c).add(d.clone().multiplyScalar(dist)); cam.lookAt(c); cam.updateMatrixWorld(); cam.updateProjectionMatrix();
    let mx = 0, minx = 9, maxx = -9, miny = 9, maxy = -9;
    for (const p of pts) { const q = p.clone().project(cam); minx = Math.min(minx, q.x); maxx = Math.max(maxx, q.x); miny = Math.min(miny, q.y); maxy = Math.max(maxy, q.y); }
    // recentre: shift look target toward projected centre
    const cx = (minx + maxx) / 2, cy = (miny + maxy) / 2;
    const right = new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 0), up = new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 1);
    const halfH = Math.tan(THREE.MathUtils.degToRad(cam.fov / 2)) * dist, halfW = halfH * cam.aspect;
    c.add(right.multiplyScalar(cx * halfW)).add(up.multiplyScalar(cy * halfH));
    mx = Math.max((maxx - minx) / 2, (maxy - miny) / 2);
    dist *= mx / fill;
  }
  cam.position.copy(c).add(d.clone().multiplyScalar(dist)); cam.lookAt(c);
}

if (VIEW === 'hero') {
  const o = prod.obj(); o.rotation.y = -0.5; root.add(o); fit(root, camera, new THREE.Vector3(-0.45, 0.62, 1), 0.8);
} else if (VIEW === 'low') {
  const o = prod.obj(); o.rotation.y = 0.55; root.add(o); fit(root, camera, new THREE.Vector3(0.9, 0.3, 1), 0.84);
} else if (VIEW === 'exploded') {
  const o = prod.obj(); o.rotation.y = -0.5; root.add(o);
  o.traverse((c) => { if (c.userData.ex && c.parent) c.position.add(c.userData.ex.clone().multiplyScalar(1.0)); if (c.userData.exRot) c.rotation.z = -c.userData.exRot; });
  fit(root, camera, new THREE.Vector3(-0.45, 0.7, 1), 0.8);
